:root{
  --bg:#02060a;--bg2:#050c12;--panel:#080f16;--panel2:#0c1420;
  --fg:#c8f7ff;--dim:#4a6a80;--dim2:#2a4050;
  --line:#0d1a24;--line2:#1a2c3a;
  --gold:#ffd700;--cyan:#00ccff;--lime:#39ff88;--pink:#ff66ff;
  --red:#ff4444;--orange:#ffaa00;--violet:#a78bfa;
  --shadow:0 20px 60px rgba(0,0,0,.7);
  --accent:var(--cyan);
}
body.eye{--accent:var(--cyan)}
body.brain{--accent:var(--pink)}
body.locked{--accent:var(--gold)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--fg);
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%, #0a1420 0%, #02060a 60%, #000 100%)}
button{background:transparent;border:1px solid var(--line2);color:var(--fg);
  padding:5px 11px;border-radius:6px;font:inherit;font-size:10.5px;
  letter-spacing:1.2px;cursor:pointer;transition:.15s;font-family:inherit}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--red);color:var(--red)}
button.danger:hover{background:rgba(255,68,68,.15)}
button.primary{border-color:var(--gold);color:var(--gold)}
button.primary:hover{background:rgba(255,215,0,.12)}
input{background:var(--bg2);color:var(--fg);border:1px solid var(--line2);
  padding:5px 8px;border-radius:5px;font:inherit;font-size:10.5px;font-family:inherit}
input:focus{outline:0;border-color:var(--accent)}
/* BOOT OVERLAY */
#boot{position:fixed;inset:0;z-index:9000;background:#000;display:flex;
  flex-direction:column;justify-content:center;align-items:center;
  transition:opacity .8s ease;padding:24px}
#boot.fade{opacity:0;pointer-events:none}
#boot h1{font-size:20px;letter-spacing:6px;color:var(--gold);font-weight:400;
  margin-bottom:8px;text-shadow:0 0 20px rgba(255,215,0,.4)}
#boot .sub{font-size:11px;letter-spacing:3px;color:var(--cyan);margin-bottom:24px}
#boot .chain{font-size:16px;letter-spacing:4px;color:var(--fg);margin-bottom:24px;
  font-weight:400}
#boot .chain b{color:var(--gold);font-weight:400}
#bootLog{width:100%;max-width:640px;height:200px;overflow:hidden;
  font-size:11px;line-height:1.6;color:var(--dim);letter-spacing:.4px}
#bootLog .l{opacity:0;animation:fadeIn .3s forwards}
#bootLog .l .t{color:var(--dim2);margin-right:8px}
#bootLog .l b{color:var(--gold);font-weight:400}
#bootLog .l.c{color:var(--cyan)}
#bootLog .l.g{color:var(--lime)}
@keyframes fadeIn{to{opacity:1}}
/* DESKTOP */
#desktop{position:fixed;inset:0;z-index:1}
#wall{position:absolute;inset:0;width:100%;height:100%;display:block}
#compass{position:absolute;top:16px;right:16px;width:96px;height:96px;
  z-index:5;opacity:.85;pointer-events:none}
#compass svg{width:100%;height:100%;display:block}
#heart{position:absolute;top:16px;left:16px;z-index:5;display:flex;
  align-items:center;gap:10px;padding:8px 14px;background:rgba(5,12,18,.7);
  border:1px solid var(--line2);border-radius:10px;backdrop-filter:blur(8px);
  font-size:10.5px;letter-spacing:1.2px}
#heart .bpm{color:var(--red);font-weight:700;font-size:14px}
#heart .dot{width:8px;height:8px;border-radius:50%;background:var(--red);
  box-shadow:0 0 10px var(--red)}
#heart .dot.beat{animation:beat .8s infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.4)}}
/* WINDOWS */
.win{position:absolute;min-width:320px;min-height:200px;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;z-index:100;
  transition:border-color .2s}
.win.active{border-color:var(--accent);
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 20px rgba(0,204,255,.15)}
.win.minimized{display:none}
.win-head{height:32px;padding:0 10px;background:linear-gradient(180deg,#0c1620,#080f16);
  border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;
  cursor:grab;font-size:11px;letter-spacing:1.4px;flex-shrink:0}
.win-head:active{cursor:grabbing}
.win-head .ic{color:var(--gold);font-weight:700}
.win-head .t{flex:1;color:var(--fg);font-weight:400}
.win-head .btns{display:flex;gap:4px}
.win-head .btns button{width:22px;height:20px;padding:0;font-size:11px;
  line-height:1;border-radius:4px}
.win-body{flex:1;overflow:auto;padding:12px;min-height:0}
.win-body::-webkit-scrollbar{width:6px;height:6px}
.win-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.win-resize{position:absolute;width:16px;height:16px;bottom:0;right:0;
  cursor:nwse-resize;z-index:2}
/* TASKBAR */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:40px;
  background:rgba(5,12,18,.94);border-top:1px solid var(--line2);
  backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;
  padding:0 10px;z-index:5000;overflow-x:auto}
#taskbar::-webkit-scrollbar{height:0}
#startBtn{background:var(--gold);color:#000;font-weight:700;padding:5px 14px;
  border:none;border-radius:6px;cursor:pointer;letter-spacing:1.4px;
  font-family:inherit;font-size:11px}
#startBtn:hover{filter:brightness(1.1)}
.tb-app{padding:4px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line2);
  border-radius:6px;cursor:pointer;font-size:10px;letter-spacing:1px;
  transition:.15s;white-space:nowrap}
.tb-app:hover{border-color:var(--accent);color:var(--accent)}
.tb-app.open{border-color:var(--accent);background:rgba(0,204,255,.12)}
.tb-app.active{background:var(--accent);color:#000;font-weight:700}
#tbRight{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:10px;
  letter-spacing:1.2px;flex-shrink:0}
.badge{padding:2px 7px;border-radius:999px;border:1px solid var(--line2);
  color:var(--dim);font-size:9.5px;white-space:nowrap}
.badge.on{color:var(--accent);border-color:var(--accent)}
.badge.gold{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
#clock{font-variant-numeric:tabular-nums;color:var(--fg);min-width:64px;text-align:right}
/* START MENU */
#startMenu{position:fixed;bottom:44px;left:10px;width:280px;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);
  z-index:5001;padding:8px;display:none}
#startMenu.open{display:block;animation:slideUp .15s ease-out}
@keyframes slideUp{from{transform:translateY(8px);opacity:0}}
#startMenu h3{font-size:9px;letter-spacing:2px;color:var(--gold);
  padding:6px 8px;text-transform:uppercase;font-weight:400}
.start-app{display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:6px;cursor:pointer;transition:.1s}
.start-app:hover{background:rgba(0,204,255,.08)}
.start-app .ic{font-size:16px;width:24px;text-align:center}
.start-app .n{font-size:11px;letter-spacing:1px;color:var(--fg)}
.start-app .d{font-size:9px;color:var(--dim);letter-spacing:.6px}
/* COMMAND PALETTE */
#cmd{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.6);
  display:none;align-items:flex-start;justify-content:center;padding-top:15vh;
  backdrop-filter:blur(4px)}
#cmd.open{display:flex}
#cmdInner{width:100%;max-width:520px;background:var(--panel);
  border:1px solid var(--gold);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.8);
  overflow:hidden}
#cmdInput{width:100%;background:transparent;border:0;padding:16px 20px;
  font:inherit;font-size:14px;color:var(--fg);border-bottom:1px solid var(--line2);
  font-family:inherit}
#cmdInput:focus{outline:0}
#cmdList{max-height:340px;overflow-y:auto}
.cmd-item{padding:10px 20px;cursor:pointer;display:flex;gap:12px;align-items:center;
  transition:.1s}
.cmd-item:hover,.cmd-item.sel{background:rgba(0,204,255,.1)}
.cmd-item .ic{font-size:16px;width:20px;text-align:center;color:var(--gold)}
.cmd-item .n{font-size:12px;letter-spacing:1px;color:var(--fg)}
.cmd-item .k{margin-left:auto;font-size:9px;color:var(--dim2);letter-spacing:1px}
/* APP: RAMDISK */
.sector-grid{display:grid;grid-template-columns:repeat(27,1fr);gap:2px;
  padding:6px;background:#000a12;border:1px solid var(--line);border-radius:8px}
.sector{aspect-ratio:1;background:#0a141c;border-radius:2px;transition:.15s}
.sector.used{background:var(--cyan);box-shadow:0 0 4px var(--cyan)}
.sector.rom{background:var(--lime);box-shadow:0 0 4px var(--lime)}
.row{display:flex;justify-content:space-between;padding:4px 8px;font-size:11px;
  border-bottom:1px dotted var(--line2)}
.row:last-child{border-bottom:0}
.row b{color:var(--fg);font-weight:400}
.stat-line{font-size:10px;letter-spacing:1.2px;color:var(--dim);margin:8px 0}
.stat-line b{color:var(--fg);font-weight:400}
.shell{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;max-height:120px;overflow-y:auto;font-size:10.5px;line-height:1.7;
  margin:10px 0}
.shell .l{display:flex;gap:8px}
.shell .t{color:var(--dim2)}
.shell .m{color:var(--cyan)}
.shell .m.ok{color:var(--lime)}
.shell .m.err{color:var(--red)}
.shell .m.gold{color:var(--gold);font-weight:700}
.shell-in{display:flex;gap:6px;align-items:center;margin-top:8px}
.shell-in .p{color:var(--gold);font-weight:700}
.shell-in input{flex:1}
/* APP: MAINBOARD */
.slot{background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:10px;
  padding:10px;margin-bottom:8px}
.slot-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:6px}
.slot .name{font-weight:700;letter-spacing:2px;font-size:12px}
.slot .name.RAM{color:var(--cyan)}
.slot .name.ROM{color:var(--gold)}
.slot .name.GPU{color:var(--violet)}
.slot .name.CPU{color:var(--lime)}
.slot .name.SLI{color:var(--pink)}
.slot .state{font-size:9px;letter-spacing:1.2px;padding:2px 7px;
  border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.slot .state.taken{background:var(--gold);color:#000;border-color:var(--gold)}
.slot .desc{font-size:10px;color:var(--dim);margin-bottom:6px}
.slot select,.slot input{width:100%;margin-bottom:6px}
/* APP: SCANNER */
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dir-btn{padding:6px;border:1px solid var(--line2);border-radius:6px;
  cursor:pointer;transition:.15s;font-size:10px;letter-spacing:1px;text-align:center}
.dir-btn.N{color:#ff4444}
.dir-btn.NE{color:#ffaa00}
.dir-btn.E{color:#00ccff}
.dir-btn.SE{color:#39ff88}
.dir-btn.S{color:#ffd700}
.dir-btn.SW{color:#ff66ff}
.dir-btn.W{color:#a78bfa}
.dir-btn.NW{color:#ff6ec7}
.dir-btn.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
#radarCanvas{width:100%;height:180px;display:block;background:#000a12;
  border-radius:8px;border:1px solid var(--line);margin:8px 0}
/* APP: EVOCHTAAL */
#axesCanvas{width:100%;height:240px;display:block;background:#000a12;
  border-radius:8px;border:1px solid var(--line);margin:8px 0}
.axis-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.axis-card{background:rgba(0,0,0,.25);border:1px solid var(--line2);
  border-radius:8px;padding:8px;text-align:center}
.axis-card .n{font-size:16px;font-weight:700;line-height:1}
.axis-card .l{font-size:8px;color:var(--dim);letter-spacing:1.2px;margin-top:2px}
.axis-card .v{font-size:10px;margin-top:4px;font-weight:700}
/* APP: BOOT */
#bootTerm{background:rgba(3,8,12,.6);border:1px solid var(--line2);
  border-radius:8px;padding:10px;max-height:280px;overflow-y:auto;
  font-size:11px;line-height:1.75;letter-spacing:.3px}
#bootTerm .l{display:grid;grid-template-columns:64px 56px 1fr;gap:10px;
  padding:1px 0;opacity:0;animation:fadeIn .3s forwards}
#bootTerm .l .ts{color:var(--dim2);font-size:10px}
#bootTerm .l .bd{font-size:9px;letter-spacing:1.2px}
#bootTerm .l.core .bd{color:var(--gold)}
#bootTerm .l.ram .bd{color:var(--cyan)}
#bootTerm .l.rom .bd{color:var(--lime)}
#bootTerm .l.mode .bd{color:var(--pink)}
#bootTerm .l.atem .bd{color:var(--orange)}
#bootTerm .l .msg{color:var(--fg)}
/* APP: COCKPIT */
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:11px;
  padding:6px 0;border-bottom:1px dotted var(--line2)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.kv .v{color:var(--fg);font-weight:400}
.kv .v.gold{color:var(--gold);font-weight:700}
@media(max-width:700px){
  .win{position:fixed !important;left:0 !important;right:0 !important;
    top:60px !important;bottom:44px !important;width:auto !important;
    height:auto !important;min-width:0;border-radius:0;margin:0}
  .win.minimized{display:none}
  #compass{width:64px;height:64px}
  #heart{padding:6px 10px;font-size:9px}
  #heart .bpm{font-size:11px}
  .axis-list{grid-template-columns:repeat(2,1fr)}
}
