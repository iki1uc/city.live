#root{max-width:1480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}

/* HEADER */
header{border:1px solid var(--line2);border-radius:14px;
  padding:12px 16px;background:rgba(5,12,18,.7);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.h-title{font-size:16px;letter-spacing:4px;color:var(--gold);font-weight:700}
.h-title small{color:var(--cyan);font-weight:400;letter-spacing:2px;font-size:10px}
.h-chain{font-size:13px;letter-spacing:3px;color:var(--fg);margin-top:4px}
.h-chain span{color:var(--cyan)}
.h-chain b{color:var(--gold);font-weight:400}
.h-meta{font-size:9.5px;color:var(--dim);margin-top:4px;letter-spacing:1.4px}
.h-badges{display:flex;gap:6px;flex-wrap:wrap}
.h-badge{font-size:9.5px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line2);color:var(--dim);letter-spacing:1.2px}
.h-badge.c{color:var(--core);border-color:var(--core)}
.h-badge.r{color:var(--ram);border-color:var(--ram)}
.h-badge.o{color:var(--rom);border-color:var(--rom)}
.h-badge.m{color:var(--mode);border-color:var(--mode)}

/* LAYOUT */
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:12px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}

/* TERMINAL */
.term{background:rgba(3,8,12,.85);border:1px solid var(--line2);
  border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
  min-height:520px}
.term-head{display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:rgba(8,15,22,.9);border-bottom:1px solid var(--line2);
  font-size:10px;letter-spacing:1.6px;color:var(--dim)}
.term-head .dots{display:flex;gap:5px}
.term-head .dot{width:8px;height:8px;border-radius:50%;background:#1a2c3a}
.term-head .dot.g{background:var(--gold)}
.term-head .dot.c{background:var(--cyan)}
.term-head .dot.l{background:var(--lime)}
.term-body{padding:14px;font-size:11.5px;line-height:1.85;
  overflow-y:auto;flex:1;max-height:640px;letter-spacing:.3px}
.term-body::-webkit-scrollbar{width:6px}
.term-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.term-body::-webkit-scrollbar-track{background:transparent}

.line{display:grid;grid-template-columns:78px 86px 1fr;gap:12px;
  padding:2px 0;opacity:1;animation:slide .3s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.line .ts{color:var(--dim2);font-size:10.5px}
.line .badge{font-size:9.5px;letter-spacing:1.4px;text-align:left;
  padding:1px 6px;border-radius:4px;height:fit-content;width:fit-content;
  background:rgba(255,255,255,.03);border:1px solid var(--line2)}
.line.core .badge{color:var(--core);border-color:var(--core)}
.line.ram  .badge{color:var(--ram);border-color:var(--ram)}
.line.rom  .badge{color:var(--rom);border-color:var(--rom)}
.line.mode .badge{color:var(--mode);border-color:var(--mode)}
.line.atem .badge{color:var(--atem);border-color:var(--atem)}
.line .msg{color:var(--fg);word-break:break-word}
.line .msg em{color:var(--cyan);font-style:normal}
.line .msg b{color:var(--gold);font-weight:400}
.line.cursor .msg::after{content:"▌";color:var(--cyan);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

/* PANEL */
aside{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line2);
  border-radius:14px;padding:12px}
.panel h2{font-size:10px;letter-spacing:2.4px;color:var(--gold);
  text-transform:uppercase;font-weight:400;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline}
.panel h2 span{color:var(--dim);text-transform:none;letter-spacing:1.2px;font-size:9.5px}

/* MODES */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode{display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.25);
  transition:.2s}
.mode .ic{width:8px;height:8px;border-radius:50%;background:#1a2c3a;flex-shrink:0}
.mode .nm{font-size:11px;letter-spacing:1.4px;color:var(--dim)}
.mode .desc{font-size:8.5px;color:var(--dim2);letter-spacing:.8px;margin-top:1px}
.mode.act{border-color:var(--mode);background:rgba(255,102,255,.08)}
.mode.act .ic{background:var(--mode);box-shadow:0 0 12px var(--mode);animation:mpulse 1.5s infinite}
.mode.act .nm{color:var(--mode);font-weight:700}
@keyframes mpulse{50%{opacity:.5}}

/* ATEM */
.atem-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.atem-circle{position:relative;width:150px;height:150px}
.atem-circle svg{width:100%;height:100%;display:block}
.atem-phase{font-size:11px;letter-spacing:2px;color:var(--atem);
  text-align:center;height:20px;transition:.15s}
.atem-phase b{color:var(--fg)}
.atem-track{display:flex;gap:3px;width:100%;height:4px;margin-top:4px}
.atem-track div{flex:1;height:100%;background:#0a1a24;border-radius:2px;transition:.2s}
.atem-track div.ein{background:#ffaa00}
.atem-track div.halt{background:#a78bfa}
.atem-track div.aus{background:#00ccff}

/* CHAIN */
.chain{display:flex;flex-direction:column;gap:4px}
.chain-step{display:flex;align-items:center;gap:8px;font-size:11px;
  padding:4px 8px;border-radius:6px;transition:.15s}
.chain-step .num{width:44px;text-align:right;font-weight:700;
  letter-spacing:1.2px;color:var(--fg)}
.chain-step .arrow{color:var(--dim2);font-size:14px}
.chain-step .lbl{font-size:9px;color:var(--dim);letter-spacing:1.2px}
.chain-step.act{background:rgba(255,215,0,.08)}
.chain-step.act .num{color:var(--gold);text-shadow:0 0 10px var(--gold)}

/* RAM */
.ram-rows{display:flex;flex-direction:column;gap:4px;font-size:11px}
.ram-row{display:grid;grid-template-columns:1fr auto;gap:8px;
  padding:5px 8px;background:rgba(0,0,0,.25);border-radius:6px;
  border:1px solid transparent;transition:.15s}
.ram-row.tick{border-color:var(--ram);background:rgba(0,204,255,.06)}
.ram-row .k{color:var(--dim);font-size:10.5px}
.ram-row .v{color:var(--ram);font-weight:700;font-size:12px;letter-spacing:1.4px}

/* ROM */
.rom-status{display:flex;flex-direction:column;gap:6px;font-size:10.5px}
.rom-row{display:flex;justify-content:space-between;align-items:center;
  padding:4px 8px;background:rgba(0,0,0,.25);border-radius:6px}
.rom-row .k{color:var(--dim);letter-spacing:1.2px;font-size:10px}
.rom-row .v{color:var(--rom);font-weight:700;letter-spacing:1.2px}
.rom-flash{animation:rflash .6s ease-out}
@keyframes rflash{0%{background:rgba(57,255,136,.35);transform:scale(1.02)}
  100%{background:rgba(0,0,0,.25);transform:scale(1)}}

/* SAT 81 */
.sat{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;
  padding:8px;background:rgba(0,0,0,.25);border-radius:8px;
  opacity:.15;transition:.3s}
.sat.on{opacity:1}
.sat div{aspect-ratio:1;background:var(--lime);border-radius:50%;
  box-shadow:0 0 4px var(--lime);opacity:0;transition:.3s}
.sat.on div{opacity:.65;animation:satin 2s infinite}
@keyframes satin{0%,100%{opacity:.35}50%{opacity:.85}}
.sat div.g{background:var(--gold);box-shadow:0 0 6px var(--gold)}

/* TRANSPORT */
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 12px;background:var(--panel);border:1px solid var(--line2);
  border-radius:12px}
.transport .time{font-size:11px;letter-spacing:1.2px;color:var(--gold);
  font-variant-numeric:tabular-nums;min-width:80px}
.transport .spd{font-size:10.5px;color:var(--dim);letter-spacing:1.2px}
.scrub{flex:1;min-width:180px}
.scrub input{width:100%}

/* FOOTER */
footer{text-align:center;font-size:8.5px;color:var(--dim2);
  letter-spacing:1.6px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
footer b{color:var(--gold);font-weight:400}
