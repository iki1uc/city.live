:root{
  --bg:#02060a;--bg2:#050c12;--panel:#080f16;
  --fg:#c8f7ff;--dim:#4a6a80;--dim2:#2a4050;
  --line:#0d1a24;--line2:#1a2c3a;
  --gold:#ffd700;--cyan:#00ccff;--lime:#39ff88;--pink:#ff66ff;
  --red:#ff4444;--orange:#ffaa00;--violet:#a78bfa;--mag:#ff66ff;
  --ram:#00ccff;--rom:#39ff88;--bio:#ff4444;--atem:#ffaa00;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);min-height:100vh;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at 50% 0%, #0a1420 0%, #02060a 60%, #000 100%)}
button{background:transparent;border:1px solid var(--line2);color:var(--fg);
  padding:5px 11px;border-radius:6px;font:inherit;font-size:10.5px;
  letter-spacing:1.2px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button.primary{border-color:var(--gold);color:var(--gold)}
button.primary:hover{background:rgba(255,215,0,.12)}
button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
button.danger{border-color:var(--red);color:var(--red)}
button.danger:hover{background:rgba(255,68,68,.12)}
input{background:var(--bg2);color:var(--fg);border:1px solid var(--line2);
  padding:6px 10px;border-radius:6px;font:inherit;font-size:11.5px}
input:focus{outline:0;border-color:var(--cyan)}

#root{max-width:1520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}

/* HEADER */
header{border:1px solid var(--line2);border-radius:14px;
  padding:12px 16px;background:rgba(5,12,18,.7);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.h-title{font-size:16px;letter-spacing:4px;color:var(--gold);font-weight:700}
.h-title small{color:var(--cyan);font-weight:400;letter-spacing:2px;font-size:10px}
.h-chain{font-size:13px;letter-spacing:3px;margin-top:4px}
.h-chain b{color:var(--gold);font-weight:400}
.h-chain span{color:var(--cyan)}
.h-meta{font-size:9.5px;color:var(--dim);margin-top:4px;letter-spacing:1.4px}
.h-badges{display:flex;gap:6px;flex-wrap:wrap}
.h-badge{font-size:9.5px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line2);color:var(--dim);letter-spacing:1.2px}
.h-badge.ram{color:var(--ram);border-color:var(--ram)}
.h-badge.rom{color:var(--rom);border-color:var(--rom)}
.h-badge.bio{color:var(--bio);border-color:var(--bio)}
.h-badge.lock{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}

/* LAYOUT */
.grid-main{display:grid;grid-template-columns:1fr 320px;gap:12px}
@media(max-width:1000px){.grid-main{grid-template-columns:1fr}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.grid-2{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line2);
  border-radius:14px;padding:12px}
.panel h2{font-size:10px;letter-spacing:2.4px;color:var(--gold);
  text-transform:uppercase;font-weight:400;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline}
.panel h2 span{color:var(--dim);text-transform:none;letter-spacing:1.2px;font-size:9.5px}

/* RAM DISK */
.ram-disk{display:flex;flex-direction:column;gap:10px}
.ram-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ram-capacity{font-size:11px;letter-spacing:1.2px;color:var(--dim)}
.ram-capacity b{color:var(--gold);font-weight:400;font-size:13px}
.sector-grid{display:grid;grid-template-columns:repeat(27,1fr);gap:2px;
  padding:8px;background:#000a12;border:1px solid var(--line);
  border-radius:10px;min-height:180px}
.sector{aspect-ratio:1;background:#0a141c;border-radius:2px;transition:.15s;
  position:relative;cursor:pointer}
.sector:hover{transform:scale(1.6);z-index:2;border:1px solid var(--cyan)}
.sector.free{background:#0a141c}
.sector.used{background:var(--ram);box-shadow:0 0 4px var(--ram)}
.sector.rom{background:var(--rom);box-shadow:0 0 4px var(--rom)}
.sector.locked{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.sector.bio{background:var(--bio);box-shadow:0 0 5px var(--bio)}
.legend{display:flex;gap:12px;margin-top:6px;font-size:9.5px;color:var(--dim);
  letter-spacing:1.2px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;font-style:normal}

/* FILES */
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.file-card{background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:10px;
  padding:10px;position:relative;overflow:hidden;transition:.15s;cursor:pointer}
.file-card:hover{border-color:var(--cyan);transform:translateY(-1px)}
.file-card.active{border-color:var(--ram);background:rgba(0,204,255,.06)}
.file-card.rom{border-color:var(--rom);background:rgba(57,255,136,.06)}
.file-card .name{font-size:11.5px;color:var(--gold);font-weight:700;
  letter-spacing:1.2px;word-break:break-all;margin-bottom:4px}
.file-card .path{font-size:9px;color:var(--dim2);margin-bottom:6px}
.file-card .bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;
  overflow:hidden;margin:6px 0}
.file-card .bar i{display:block;height:100%;background:var(--ram);transition:width .3s}
.file-card .stats{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim)}
.file-card .stats b{color:var(--fg);font-weight:400}
.file-card .actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.file-card .actions button{font-size:9px;padding:3px 8px}
.file-card .stamp{position:absolute;top:6px;right:8px;font-size:8px;
  padding:2px 6px;border-radius:4px;background:var(--line);color:var(--dim2);
  letter-spacing:1.2px}
.file-card .stamp.used{background:var(--ram);color:#000}
.file-card .stamp.rom{background:var(--rom);color:#000}

/* BIO MONITOR */
.bio-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bio-heart{position:relative;width:110px;height:110px;flex-shrink:0}
.bio-heart svg{width:100%;height:100%;display:block}
.bio-heart .bpm{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none}
.bio-heart .bpm .n{font-size:20px;font-weight:700;color:var(--bio);line-height:1}
.bio-heart .bpm .l{font-size:8px;color:var(--dim);letter-spacing:1.6px;margin-top:2px}
.bio-breath{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.bio-breath .label{font-size:9.5px;color:var(--dim);letter-spacing:1.4px}
.bio-breath .phase{font-size:11px;color:var(--atem);font-weight:700;letter-spacing:1.6px}
.bio-breath .track{display:flex;gap:3px;height:4px}
.bio-breath .track div{flex:1;border-radius:2px;background:#0a1a24;transition:.2s}
.bio-breath .track div.on.ein{background:var(--atem)}
.bio-breath .track div.on.halt{background:var(--violet)}
.bio-breath .track div.on.aus{background:var(--cyan)}
.bio-vitals{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex:1;min-width:180px}
.vital{background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:8px;
  padding:8px 10px;font-size:9.5px;color:var(--dim);letter-spacing:1.2px}
.vital .v{display:block;font-size:14px;font-weight:700;color:var(--fg);margin-top:2px}
.vital.eye .v{color:var(--cyan)}
.vital.brain .v{color:var(--pink)}
.vital.leben .v{color:var(--lime)}
.vital.qi .v{color:var(--gold)}

/* CHAIN */
.chain{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.chain .step{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--line2);background:rgba(0,0,0,.25);
  font-size:11px;letter-spacing:1.2px;transition:.2s}
.chain .step.act{border-color:var(--gold);background:rgba(255,215,0,.08);
  box-shadow:0 0 12px rgba(255,215,0,.2)}
.chain .step.act .num{color:var(--gold);text-shadow:0 0 8px var(--gold)}
.chain .step .num{font-weight:700;color:var(--dim);transition:.2s}
.chain .arrow{color:var(--dim2);font-size:13px}

/* COMMAND LINE */
.cmd-wrap{display:flex;flex-direction:column;gap:6px}
.cmd-log{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;max-height:160px;overflow-y:auto;
  font-size:10.5px;line-height:1.7;letter-spacing:.3px}
.cmd-log .l{display:flex;gap:8px}
.cmd-log .t{color:var(--dim2);flex-shrink:0}
.cmd-log .m{color:var(--cyan)}
.cmd-log .m.ok{color:var(--lime)}
.cmd-log .m.warn{color:var(--orange)}
.cmd-log .m.err{color:var(--red)}
.cmd-log .m.gold{color:var(--gold);font-weight:700}
.cmd-log .m.prompt{color:var(--dim)}
.cmd-log .m.prompt b{color:var(--gold);font-weight:400}
.cmd-input{display:flex;gap:6px;align-items:center}
.cmd-input .p{color:var(--gold);font-weight:700;letter-spacing:1.2px}
.cmd-input input{flex:1}

/* TOOLBAR */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.toolbar .label{font-size:9.5px;color:var(--dim);letter-spacing:1.2px;margin-right:4px}

/* FOOTER */
footer{text-align:center;font-size:8.5px;color:var(--dim2);
  letter-spacing:1.6px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
footer b{color:var(--gold);font-weight:400}

/* DIALOG */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px}
#overlay.on{display:flex}
.dialog{background:var(--panel);border:1px solid var(--gold);border-radius:14px;
  padding:20px;max-width:520px;width:100%;box-shadow:0 0 40px rgba(255,215,0,.2)}
.dialog h3{font-size:12px;letter-spacing:2.4px;color:var(--gold);text-transform:uppercase;
  margin-bottom:12px;font-weight:400}
.dialog p{font-size:10.5px;color:var(--dim);line-height:1.7;margin-bottom:12px}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end}
